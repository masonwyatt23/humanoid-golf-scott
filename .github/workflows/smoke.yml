name: smoke
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib-only check: compiles .py, rejects videos/zips/model files, parses results JSON, checks README links
      - run: python3 scripts/smoke_test.py
